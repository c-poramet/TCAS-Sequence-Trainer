<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint · Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <b class="brand">SPRINT</b><span class="ctx">Entrance exam trainer</span>
  <div class="rail">
    <div class="ind"><span>PB</span><b id="pb">--</b></div>
    <div class="ind hide-m"><span>AO5</span><b id="ao5">--</b></div>
    <div class="ind hide-m"><span>RUNS</span><b id="runs">0</b></div>
  </div>
  <button class="icon-btn" id="btnSet" title="Settings (T)" aria-label="Settings">⚙</button>
</header>

<main class="main">
  <div class="app-layout" id="layout">
    <div class="app-content">
      <div class="solver-layout">
        <section class="panel left-panel">
          <div class="panel-title">Session</div>
          <label class="lbl" for="selN">Questions</label>
          <div class="select-wrap"><select id="selN"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option><option value="custom">Custom…</option></select></div>
          <input class="custom-count" id="customN" type="number" min="1" step="1" inputmode="numeric" placeholder="Custom question count" aria-label="Custom question count" hidden>
          <label class="lbl mt" for="selMode">Answer mode</label>
          <div class="select-wrap"><select id="selMode"><option value="choice">Multiple choice (1–5)</option><option value="type">Type answer</option></select></div>
          <label class="lbl mt" for="selDifficulty">Difficulty</label>
          <div class="select-wrap"><select id="selDifficulty"><option value="mixed">Mixed logic</option><option value="hard">Hard · entangled functions</option><option value="expert">Expert · nested functions</option></select></div>
          <label class="lbl mt" for="selComposition">Mixed logic composition</label>
          <div class="select-wrap"><select id="selComposition"><option value="light">Light · core rules</option><option value="balanced">Balanced · occasional composition</option><option value="composed">Composed · include entangled</option></select></div>
          <label class="training-toggle"><input type="checkbox" id="chkTraining"> Anki-style weakness training</label>
          <label class="lbl mt" for="selTagFilter">Practice tag</label>
          <div class="select-wrap"><select id="selTagFilter"><option value="all">All functions</option></select></div>
          <div class="panel-title mt">Topics</div>
          <div id="topicList"></div>
          <button class="btn-primary mt" id="btnStart">Start · Space</button>
          <p class="hint">Time + 2s per wrong answer. Keys 1–5 to answer. Esc quits.</p>
        </section>
        <section class="panel right-panel">
          <div class="panel-title">Weakness analysis</div>
          <div class="select-wrap stat-filter"><select id="selStatFilter" aria-label="Filter stats"><option value="all">All topics</option><option value="weak">Needs practice</option><option value="strong">Strong topics</option></select></div>
          <div id="stats"></div>
          <div class="panel-title mt">Records chart</div>
          <div class="chart" id="chart"></div>
          <div class="panel-title mt">What to improve</div>
          <div class="guide" id="guide"></div>
          <div class="panel-title mt">Training frequency</div>
          <div id="frequency"></div>
          <div class="panel-title mt">Recent runs</div>
          <div id="hist"></div>
        </section>
      </div>
    </div>
    <aside class="panel settings-side" aria-label="Settings">
      <div class="panel-title">Settings <button class="icon-btn close" id="btnClose" aria-label="Close settings">✕</button></div>
      <label class="lbl" for="rngScale">Font size <span id="scaleVal">100%</span></label>
      <input type="range" id="rngScale" min="0.85" max="1.4" step="0.05" value="1">
      <button class="btn-secondary mt" id="btnReset">Erase all local data</button>
    </aside>
  </div>
</main>
<footer class="footer">Data is stored only in this browser (localStorage).</footer>

<div class="stage" id="stage" hidden></div>
<script src="app.js"></script>
</body>
</html>
